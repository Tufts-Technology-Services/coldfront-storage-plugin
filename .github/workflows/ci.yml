name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      # python-ldap is built from source on Linux, against these
      - name: Install the libraries python-ldap builds against
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Check for lint violations
        run: uv run --locked --only-group dev ruff check

      - name: Check formatting
        run: uv run --locked --only-group dev ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is what the Tufts hosts run
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}

      # python-ldap is built from source on Linux, against these
      - name: Install the libraries python-ldap builds against
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Run the tests
        run: uv run --no-sync pytest
